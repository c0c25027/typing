<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Mind Map</title>
  <meta name="description" content="英単語の関連語をつないでいく、音声入力対応のマインドマップです。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="toolbar">
    <h1>Word Mind Map</h1>
    <form id="word-form" class="word-form" autocomplete="off">
      <input id="word-input" type="text" inputmode="latin" lang="en" spellcheck="false"
             aria-label="英単語" placeholder="最初の英単語を入力（例: ocean）">
      <button type="submit" class="primary">追加</button>
      <button type="button" id="mic-btn" class="mic" aria-pressed="false" title="音声入力（M キー）">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        <span class="label">音声入力</span>
      </button>
    </form>
    <label class="follow"><input type="checkbox" id="follow-new"> 追加した単語に移動</label>
    <div class="tools">
      <button type="button" id="zoom-out" title="縮小" aria-label="縮小">−</button>
      <button type="button" id="zoom-in" title="拡大" aria-label="拡大">＋</button>
      <button type="button" id="reset-view" title="すべての単語が収まるように表示">全体</button>
      <button type="button" id="export-btn" title="JSON で保存">書き出し</button>
      <label class="file-btn" title="JSON を読み込む">読み込み<input type="file" id="import-input" accept="application/json,.json" hidden></label>
      <button type="button" id="clear-btn" class="danger">全消去</button>
    </div>
  </header>

  <main class="layout">
    <section class="canvas-wrap">
      <svg id="map" role="img" aria-label="英単語のマインドマップ"></svg>
      <div id="interim" class="interim" hidden aria-live="polite"></div>
      <div id="empty-state" class="empty-state">
        <p class="big">英単語を1つ入力するか、🎤 で話してみましょう</p>
        <p>単語を選ぶと関連語の候補が出ます。候補をクリック、または候補の単語を声に出すとつながります。</p>
        <p class="muted">操作: ドラッグで移動 / ホイールで拡大縮小 / ダブルクリックで発音 / M キーでマイク</p>
      </div>
      <div id="legend" class="legend" aria-label="線の色の凡例"></div>
    </section>

    <aside id="panel" class="panel" aria-label="選択中の単語">
      <div class="panel-head">
        <h2 id="sel-word">単語を選択してください</h2>
        <div class="panel-actions">
          <button type="button" id="speak-btn" title="発音を聞く">🔊 発音</button>
          <button type="button" id="center-btn" title="この単語を中央に表示">中央へ</button>
          <button type="button" id="delete-btn" class="danger" title="この単語を削除（Delete キー）">削除</button>
        </div>
      </div>

      <h3>意味（英英）</h3>
      <ul id="sel-defs" class="defs"></ul>

      <h3>関連語の候補</h3>
      <div id="relation-tabs" class="tabs" role="group" aria-label="関連の種類"></div>
      <div id="suggestions" class="chips" aria-live="polite"></div>
      <div class="suggest-foot">
        <span id="source-note" class="muted small"></span>
        <button type="button" id="add-all-btn">すべて追加</button>
      </div>

      <h3>つながっている単語</h3>
      <ul id="neighbors" class="neighbors"></ul>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/model.js"></script>
  <script src="js/related-words.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/view.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
